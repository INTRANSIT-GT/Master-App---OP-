services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: omnia, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: omnia }
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    depends_on: [db]
    ports: ["3001:3001"]
    restart: unless-stopped
volumes: { pgdata: {} }
