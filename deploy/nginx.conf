# Alternativa a Caddy. Portal en /, Transportes (estático) en /transportes/ y Operaciones en /operaciones/.
# Ajusta server_name, las rutas de root/alias y el certificado TLS (certbot) de tu servidor.
server {
    listen 80;
    server_name operaciones.tudominio.com;

    location = /transportes  { return 301 /transportes/; }
    location = /operaciones  { return 301 /operaciones/; }

    location /operaciones/ {
        proxy_pass http://127.0.0.1:3001;      # la ruta base se conserva: BASE_PATH=/operaciones
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /transportes/ {
        alias /srv/transportes/;               # carpeta de la Master App (index.html, js/, css/, ...)
        try_files $uri $uri/ /transportes/index.html;
    }

    location / {
        root /srv/portal;
        try_files $uri $uri/ /index.html;
    }
}
